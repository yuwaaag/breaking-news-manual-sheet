<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --main-red: #ff0000; --gold: #ffcc00; }
        body, html { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: 'Oswald', sans-serif; }

        .breaking-bg {
            width: 100%; height: 100%;
            background: radial-gradient(circle, #220000 0%, #000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 20px solid; border-image: linear-gradient(to right, var(--main-red), var(--gold)) 1;
            position: relative; overflow: hidden;
        }

        .rays {
            position: absolute; top: 50%; left: 50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,0,0,0.2), transparent 40deg);
            animation: rotate 10s linear infinite; transform-origin: center;
        }

        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .header-box { z-index: 10; animation: bounce 1.5s infinite alternate; }
        .header-text {
            font-size: 160px; color: white; text-transform: uppercase;
            text-shadow: 0 0 20px var(--main-red), 0 0 40px var(--main-red);
            font-weight: 900; margin: 0; letter-spacing: 5px;
        }

        .news-container {
            width: 85%; background: rgba(255, 255, 255, 0.95);
            padding: 60px; border-radius: 0 100px 0 100px;
            box-shadow: 0 0 50px rgba(255,0,0,0.6);
            z-index: 10; transform: skewX(-5deg);
            border: 8px solid var(--gold); margin-top: 40px; min-height: 150px;
            display: flex; align-items: center; justify-content: center;
        }

        .news-text { font-size: 70px; color: #111; text-align: center; margin: 0; font-weight: bold; line-height: 1.2; }
        .live-tag { position: absolute; top: 80px; left: 80px; background: var(--main-red); color: white; padding: 15px 40px; font-size: 40px; font-weight: bold; animation: blink 0.8s infinite; z-index: 20; }

        @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.05); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<div class="breaking-bg">
    <div class="rays"></div>
    <div class="live-tag">LIVE</div>
    <div class="header-box"><h1 class="header-text">BREAKING NEWS</h1></div>
    <div class="news-container"><p class="news-text" id="headline">कृपया स्क्रीन पर क्लिक करें...</p></div>
</div>

<audio id="newsSound" loop>
    <source src="https://www.soundjay.com/free-music/sounds/action-movie-trailer-01.mp3" type="audio/mpeg">
</audio>

<script>
    // अपनी Google Sheet ID यहाँ डालें
    const SHEET_ID = '1qGuxjH6a6jj3O6cGV6njELhricDzkP4zlnRLkRno5Hc'; 
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

    let newsData = [];
    let currentIndex = 0;

    async function loadSheetNews() {
        try {
            const response = await fetch(CSV_URL + '&cachebuster=' + new Date().getTime());
            const data = await response.text();
            
            // CSV को सही से साफ़ करना
            const rows = data.split(/\r?\n/);
            newsData = rows
                .map(row => row.replace(/^"|"$/g, '').trim()) // Quotes हटाना
                .filter(row => row !== "" && row.toLowerCase() !== "news"); // Header और खाली लाइन हटाना
            
            if (newsData.length > 0 && currentIndex === 0) {
                showNews();
            }
        } catch (e) { 
            console.error("Sheet Load Error");
            document.getElementById('headline').innerText = "Sheet Load Error! Link Check Karein.";
        }
    }

    function showNews() {
        if (newsData.length === 0) return;

        // अगर Index डेटा से बाहर निकल जाए तो वापस 0 पर लाएं
        if (currentIndex >= newsData.length) currentIndex = 0;

        const currentHeadline = newsData[currentIndex];
        document.getElementById('headline').innerText = currentHeadline;
        
        speakNow(currentHeadline);
        
        currentIndex++;
        
        // 15 सेकंड बाद अगली खबर
        setTimeout(showNews, 5000);
    }

    function speakNow(txt) {
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance("बड़ी खबर. " + txt);
        speech.lang = 'hi-IN';
        speech.rate = 0.85;
        window.speechSynthesis.speak(speech);
    }

    window.onclick = () => {
        document.getElementById('newsSound').volume = 0.3;
        document.getElementById('newsSound').play();
        loadSheetNews();
    };

    // हर 1 मिनट में शीट से ताज़ा डेटा अपडेट करना
    setInterval(loadSheetNews, 60000);
</script>

</body>
</html>
